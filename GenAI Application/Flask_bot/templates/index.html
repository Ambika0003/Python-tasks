<!DOCTYPE html>
<html>

<head>

    <title>Gemini AI Chatbot</title>

    <style>

        body{
            font-family: Arial;
            padding: 40px;
        }

        h1{
            color: #333;
        }

        input{
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }

        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #response{
            margin-top: 30px;
            white-space: pre-wrap;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <h1>Gemini AI Chatbot</h1>

    <input
        type="text"
        id="question"
        placeholder="Ask something..."
    >

    <button onclick="askGemini()">
        Ask
    </button>

    <div id="response"></div>

    <script>

        async function askGemini(){

            let question =
                document.getElementById("question").value

            let response = await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            })

            let data = await response.json()

            document.getElementById("response").innerText =
                data.answer
        }

    </script>

</body>

</html>
