{% extends "base.html" %}

{% block title %}CineWave | Login{% endblock %}

{% block content %}
<div class="auth-page fade-in-up">
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to book your tickets and view reservations</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required placeholder="Enter username (e.g. user)">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Enter password (e.g. user123)">
            </div>
            
            <button type="submit" class="nav-btn auth-btn">Log In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Sign Up Now</a>
        </div>
    </div>
</div>
{% endblock %}
