{% extends "base.html" %}

{% block title %}CineWave | Sign Up{% endblock %}

{% block content %}
<div class="auth-page fade-in-up">
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join us to reserve VIP seating and save bookings</p>
        </div>
        
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="Choose your email address">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Create a secure password">
            </div>
            
            <button type="submit" class="nav-btn auth-btn">Register</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
